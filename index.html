<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <!-- BGM AUDIO -->

    <nav class="navbar-top" id="navbarTop">
        <h1 class="logo" onclick="window.location.reload()"><span class="red">XSOCIETY</span>HUB</h1>
        <div class="nav-actions">

            <select id="langSelect" class="lang-select">

                <option value="id">🇮🇩 ID</option>
                <option value="en">🇬🇧 EN</option>
            </select>

            <button id="bgmToggle" class="bgm-btn" title="Play/Pause BGM">

                <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <div class="search-box-top">
                <input type="text" id="searchInput" placeholder="Cari manga, manhwa, manhua...">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
        </div>
    </nav>

    <main id="dashboardView">
        <header class="hero" id="hero">
            <div class="hero-bg" id="heroBg"></div>
            <div class="hero-gradient"></div>
            <div class="hero-content">
                <span class="trending-badge">TRENDING</span>
                <h2 id="heroTitle">Memuat...</h2>
                <p id="heroSynopsis">...</p>
                <div class="hero-buttons">
                    <button class="btn btn-red" id="heroReadBtn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Baca
                    </button>
                </div>
            </div>
        </header>
        <section class="container">
            <div class="section-header">
                <h3 class="section-title">Populer</h3>
            </div>
            <div class="tabs" id="typeTabs">
                <button class="tab active" data-type="all">Semua</button>
                <button class="tab" data-type="manga">Manga</button>
                <button class="tab" data-type="manhwa">Manhwa</button>
                <button class="tab" data-type="manhua">Manhua</button>
            </div>
            <div class="grid" id="mangaGrid"></div>
            <div class="load-more-wrap">
                <button class="btn btn-red" id="loadMoreBtn" style="display:none;">Muat lebih banyak</button>
            </div>
        </section>
    </main>

    <section id="searchView" class="container" style="display:none; padding-top: 100px;">
        <h3 class="section-title">Hasil Pencarian</h3>
        <input type="text" id="searchInputMobile" class="search-mobile" placeholder="Cari manga, manhwa, manhua...">
        <div class="grid" id="searchGrid" style="margin-top:20px;"></div>
    </section>

            </div>
            <div class="donate-section">
                <h5>Donate / Support</h5>
                <div class="qr-box">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=XSOCIETY_HUB_DONATE" alt="QRIS">
                </div>
            </div>
        </div>
    </section>

    <nav class="navbar-bottom">
        <button class="nav-btn active" onclick="switchView('dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Dashboard</span>
        </button>
        <button class="nav-btn" onclick="switchView('search')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span>Pencarian</span>
        </button>
        <button class="nav-btn" onclick="switchView('dev')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Developer</span>
        </button>
    </nav>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">&times;</button>
            <div class="modal-body">
                <div class="modal-img-wrapper">
                    <img id="modalImg" src="" alt="Cover">
                </div>
                <div class="modal-info">
                    <h3 id="modalTitle"></h3>
                    <p id="modalSynopsis"></p>
                    <div class="chapter-toolbar">
                        <span id="chapterCount" class="muted-msg" style="padding:0;"></span>
                        <button id="sortBtn" class="sort-btn">Terlama ↑</button>
                    </div>
                    <div id="chapterList" class="chapter-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="reader-overlay" id="reader">
        <button class="reader-close" id="closeReader">&times;</button>
        <div class="reader-title" id="readerTitle"></div>
        <div class="reader-content" id="readerImages"></div>
        <div class="reader-next" id="readerNext" style="display:none;">
            <button class="btn btn-dark" id="prevChapterBtn">← Sebelumnya</button>
            <button class="btn btn-red" id="nextChapterBtn">Selanjutnya →</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
